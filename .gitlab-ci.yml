stages:
  - test
  - build
  - deploy

test-job:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npm test

build-job:
  stage: build
  script:
    - docker build -t app-ads-worker .

deploy-job:
  stage: deploy
  script:
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker compose up -d
