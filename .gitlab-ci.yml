stages:
  - test
  - build
  - deploy

test-job:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npm test
    - npm run test:integration

build-job:
  stage: build
  script:
    - docker build -t app-ads-worker .

deploy-job:
  stage: deploy
  script:
    - docker compose up -d
