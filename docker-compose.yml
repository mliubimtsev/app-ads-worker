name: app-ads-worker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-appads}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appads}
      POSTGRES_DB: ${DB_NAME:-appads}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-appads} -d ${DB_NAME:-appads}']
      interval: 5s
      timeout: 5s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 15

  s3server:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-accessKey1}
      SCALITY_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-verySecretKey1}
      S3BACKEND: file
      REMOTE_MANAGEMENT_DISABLE: 1
    ports:
      - '${S3_PORT:-9000}:8000'
    volumes:
      - s3data:/usr/src/app/localData
      - s3metadata:/usr/src/app/localMetadata
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8000',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-appads}
      DB_PASSWORD: ${DB_PASSWORD:-appads}
      DB_NAME: ${DB_NAME:-appads}
      APP_ADS_AUTO_MIGRATE: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://s3server:8000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-accessKey1}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-verySecretKey1}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-app-ads-raw}
      S3_FORCE_PATH_STYLE: 'true'
      APP_ADS_ENABLE_DEV_SCHEDULER: 'true'
      APP_ADS_DEV_SEED: 'true'
      APP_ADS_DEV_SCHEDULER_INTERVAL_MS: '120000'
      APP_ADS_PARTITION_MAINTENANCE: 'true'
      APP_ADS_MOCK_DOMAIN: ${APP_ADS_MOCK_DOMAIN:-http://localhost:3333/app-ads.txt}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
  s3metadata:
  pgadmin_data:
